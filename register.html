<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF9" />
  <title>Crear cuenta — Velmora</title>
  <meta name="description" content="Crea tu cuenta en Velmora." />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <main class="auth-screen">
    <div class="auth-container fade-in">
      <div class="auth-logo">Vel<span>mora</span></div>
      <p class="auth-tagline">Crea tu cuenta</p>

      <div id="auth-alert-container"></div>

      <form class="auth-form" id="register-form" novalidate>
        <div class="field">
          <label class="field-label" for="reg-name">Nombre</label>
          <input class="field-input" type="text" id="reg-name" name="name" maxlength="40" autocomplete="name" required />
        </div>

        <div class="field">
          <label class="field-label" for="reg-username">Nombre de usuario</label>
          <input class="field-input" type="text" id="reg-username" name="username" maxlength="20" autocomplete="username" required />
          <span class="field-hint">Entre 3 y 20 caracteres. Solo letras, números, punto o guion bajo.</span>
          <span class="field-error" id="reg-username-error"></span>
        </div>

        <div class="field">
          <label class="field-label" for="reg-email">Correo electrónico</label>
          <input class="field-input" type="email" id="reg-email" name="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label class="field-label" for="reg-password">Contraseña</label>
          <input class="field-input" type="password" id="reg-password" name="password" autocomplete="new-password" minlength="6" required />
          <span class="field-hint">Mínimo 6 caracteres.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="register-submit">
          Crear cuenta
        </button>
      </form>

      <p class="auth-form-footer">
        ¿Ya tienes cuenta? <a href="login.html" class="auth-link">Inicia sesión</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/firebase.js"></script>
  <script type="module">
    import { registerUser, translateAuthError } from "./js/auth.js";
    import { guardSubmit } from "./js/security.js";
    import { isValidUsername } from "./js/utils.js";
    import { ROUTES } from "./js/config.js";

    const form = document.getElementById("register-form");
    const submitBtn = document.getElementById("register-submit");
    const alertContainer = document.getElementById("auth-alert-container");
    const usernameInput = document.getElementById("reg-username");
    const usernameError = document.getElementById("reg-username-error");

    function showAlert(message) {
      alertContainer.innerHTML = `<div class="auth-alert" role="alert">${message}</div>`;
    }

    usernameInput.addEventListener("input", () => {
      if (usernameInput.value && !isValidUsername(usernameInput.value)) {
        usernameInput.classList.add("is-invalid");
        usernameError.textContent = "Formato de usuario no válido.";
      } else {
        usernameInput.classList.remove("is-invalid");
        usernameError.textContent = "";
      }
    });

    form.addEventListener(
      "submit",
      guardSubmit(form, async () => {
        alertContainer.innerHTML = "";
        const displayName = document.getElementById("reg-name").value.trim();
        const username = usernameInput.value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Creando cuenta…";

        try {
          await registerUser({ email, password, username, displayName });
          window.location.href = ROUTES.HOME;
        } catch (err) {
          showAlert(err.message || translateAuthError(err));
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Crear cuenta";
        }
      })
    );
  </script>
</body>
</html>
