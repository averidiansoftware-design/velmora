<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF9" />
  <title>Iniciar sesión — Velmora</title>
  <meta name="description" content="Inicia sesión en Velmora." />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <main class="auth-screen">
    <div class="auth-container fade-in">
      <div class="auth-logo">Vel<span>mora</span></div>
      <p class="auth-tagline">Inicia sesión para continuar</p>

      <div id="auth-alert-container"></div>

      <form class="auth-form" id="login-form" novalidate>
        <div class="field">
          <label class="field-label" for="login-email">Correo electrónico</label>
          <input class="field-input" type="email" id="login-email" name="email" autocomplete="email" required />
          <span class="field-error" id="login-email-error"></span>
        </div>

        <div class="field">
          <label class="field-label" for="login-password">Contraseña</label>
          <input class="field-input" type="password" id="login-password" name="password" autocomplete="current-password" required />
          <span class="field-error" id="login-password-error"></span>
          <a href="#" class="auth-forgot" id="forgot-password-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit">
          Iniciar sesión
        </button>
      </form>

      <p class="auth-form-footer">
        ¿No tienes cuenta? <a href="register.html" class="auth-link">Regístrate</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/firebase.js"></script>
  <script type="module">
    import { loginUser, translateAuthError, resetPassword } from "./js/auth.js";
    import { guardSubmit } from "./js/security.js";
    import { showToast } from "./js/utils.js";
    import { ROUTES } from "./js/config.js";

    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("login-submit");
    const alertContainer = document.getElementById("auth-alert-container");

    function showAlert(message) {
      alertContainer.innerHTML = `<div class="auth-alert" role="alert">${message}</div>`;
    }

    function clearAlert() {
      alertContainer.innerHTML = "";
    }

    form.addEventListener(
      "submit",
      guardSubmit(form, async () => {
        clearAlert();
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Entrando…";

        try {
          await loginUser({ email, password });
          window.location.href = ROUTES.HOME;
        } catch (err) {
          showAlert(translateAuthError(err));
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Iniciar sesión";
        }
      })
    );

    document.getElementById("forgot-password-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      if (!email) {
        showAlert("Escribe tu correo electrónico primero y vuelve a pulsar el enlace.");
        return;
      }
      try {
        await resetPassword(email);
        showToast("Te enviamos un correo para restablecer tu contraseña.", "success");
      } catch (err) {
        showAlert(translateAuthError(err));
      }
    });
  </script>
</body>
</html>
